<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",Inter,Arial,sans-serif;color:#e8ecf8}
.b{position:relative;width:1200px;height:630px;background:radial-gradient(700px 500px at 90% 10%,rgba(167,139,250,.4),transparent),radial-gradient(700px 500px at 0% 100%,rgba(56,189,248,.3),transparent),linear-gradient(130deg,#070b1a,#0d1530 60%,#140f33)}
.in{position:absolute;inset:60px 70px}
.tag{display:inline-block;padding:8px 20px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc}
h1{font-size:86px;line-height:1.05;margin:26px 0 18px;letter-spacing:-.03em;font-weight:800}
h1 span{background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:28px;color:#aab3d6;max-width:820px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:38px;width:760px}
.w{height:44px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px;color:#8d97bd;font-weight:600}
.w.d{background:linear-gradient(135deg,#38bdf8,#4ade80);color:#04210f;border:0}
.foot{position:absolute;left:0;bottom:0;font-size:22px;color:#8d97bd}
.orb{position:absolute;right:70px;bottom:80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7dd3fc,#6366f1 60%,#1e1b4b);box-shadow:0 0 90px rgba(99,102,241,.7);display:grid;place-items:center;font-size:110px}
</style></head><body><div class="b"><div class="orb">🌐</div><div class="in">
<span class="tag">I started learning Networking</span>
<h1>CCNA in <span>24 weeks</span></h1>
<p>From Web Developer to Network Engineer, guided by AI and built with Claude Code.</p>
<div class="grid" id="g"></div>
<div class="foot">Hafiz Muhammad Saad Khan · github.com/saadkhaan123/ccna-networking</div>
</div></div>
<script>g.innerHTML=Array.from({length:24},(_,i)=>`<div class="w ${i<1?"d":""}">${i<1?"✓":i+1}</div>`).join("")</script>
</body></html>
